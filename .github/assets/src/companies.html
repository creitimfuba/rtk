<!doctype html>
<html><head><meta charset="utf-8">
<!-- Same 18 logos and the same count as rtk-ai.app's "Starred by developers at" strip
     (rtk-ldp src/components/landing/v3/Companies.astro). Transparent background and one flat
     grey so it reads on GitHub's light and dark themes alike. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:160px;background:transparent}
.wrap{width:1280px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:'Inter',sans-serif}
.eyebrow{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#8b95a7}
.row{display:flex;align-items:center;justify-content:center;gap:30px}
.row img{display:block;width:auto;filter:brightness(0) invert(.6);opacity:.95}
.more{font-size:14px;color:#8b95a7;white-space:nowrap;margin-left:6px}
</style></head>
<body><div class="wrap">
 <p class="eyebrow">Starred by developers at</p>
 <div class="row"><img src="companies/microsoft.svg" alt="Microsoft" style="height:20px"><img src="companies/google.svg" alt="Google" style="height:22px"><img src="companies/amazon.svg" alt="Amazon" style="height:22px"><img src="companies/meta.svg" alt="Meta" style="height:20px"><img src="companies/apple.svg" alt="Apple" style="height:29px"><img src="companies/nvidia.svg" alt="NVIDIA" style="height:19px"><img src="companies/ibm.svg" alt="IBM" style="height:24px"><img src="companies/tencent.svg" alt="Tencent" style="height:17px"><img src="companies/bytedance.svg" alt="ByteDance" style="height:19px"></div>
 <div class="row"><img src="companies/alibaba.svg" alt="Alibaba" style="height:18px"><img src="companies/shopify.svg" alt="Shopify" style="height:21px"><img src="companies/datadog.svg" alt="Datadog" style="height:22px"><img src="companies/sap.svg" alt="SAP" style="height:26px"><img src="companies/adobe.svg" alt="Adobe" style="height:21px"><img src="companies/intel.svg" alt="Intel" style="height:24px"><img src="companies/samsung.svg" alt="Samsung" style="height:18px"><img src="companies/bosch.svg" alt="Bosch" style="height:20px"><img src="companies/cisco.svg" alt="Cisco" style="height:26px"><span class="more">+1,100 more companies</span></div>
</div></body></html>
